<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <form action="/submit-destination" method="POST">
  <label for="vehicle">Choose a vehicle</label>
  <select name="vehicle" id="parking">
    <option value="motor">motor</option>
    <option value="car">car</option>
  </select>
</form>
   <label for="ម៉ោងចូល">ម៉ោងចូល</label>
   <input type="time" id="v1" placeholder="please enter value 1">
    <label for="ម៉ោងចេញ">ម៉ោងចេញ</label>
    <input type="time" id="v2" placeholder="please enter value 2">
    <p id="total"></p>
    <button onclick="Minus()">គណនា</button>
  <script>
        function Minus(){
        let v1= document.getElementById('v1').value;
        let v2= document.getElementById('v2').value;
        console.log(v1,v2);
        let result= parseFloat(v2)-parseFloat(v1);
        document.getElementById('total').innerHTML=result;
        }
    </script>
